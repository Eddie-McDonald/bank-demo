services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: bankdemo
      POSTGRES_PASSWORD: bankdemo
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./db/sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankdemo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bank-demo

  auth:
    build: ./auth
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USER: bankdemo
      DB_PASSWORD: bankdemo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank-demo

  account:
    build: ./account
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: accountdb
      DB_USER: bankdemo
      DB_PASSWORD: bankdemo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank-demo

  transfer:
    build: ./transfer
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: accountdb
      DB_USER: bankdemo
      DB_PASSWORD: bankdemo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank-demo

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_URL: http://auth:8081
      ACCOUNT_URL: http://account:5000
      TRANSFER_URL: http://transfer:8000
    depends_on:
      - auth
      - account
      - transfer
    networks:
      - bank-demo

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      GATEWAY_URL: http://gateway:3000
    depends_on:
      - gateway
    networks:
      - bank-demo

networks:
  bank-demo:
    driver: bridge
